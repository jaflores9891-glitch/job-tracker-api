services:
  db:
    image: postgres:16
    container_name: job_tracker_db
    restart: always
    environment:
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker123
      POSTGRES_DB: job_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: